<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klassenlisten-Foto-Generator (OCR-Testbilder)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f2f2f2; color: #222; }
  header { background: #2b5797; color: #fff; padding: 12px 20px; }
  header h1 { margin: 0; font-size: 20px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  .panel { background: #fff; border-radius: 8px; padding: 14px; box-shadow: 0 1px 4px #0003; width: 330px; }
  .panel h2 { margin: 0 0 10px; font-size: 16px; }
  label { display: block; margin: 8px 0 2px; font-size: 13px; font-weight: 600; }
  input[type=number], input[type=text], select { width: 100%; padding: 5px; }
  input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .chk label { display: inline-block; font-weight: 400; margin-right: 10px; }
  button { margin-top: 10px; padding: 8px 12px; border: 0; border-radius: 5px; background: #2b5797; color: #fff; cursor: pointer; font-size: 14px; }
  button.sec { background: #666; }
  button:hover { opacity: .9; }
  .out { flex: 1; min-width: 320px; }
  canvas { max-width: 100%; height: auto; background: #888; border-radius: 6px; box-shadow: 0 1px 6px #0005; }
  textarea { width: 100%; height: 220px; font-family: Consolas, monospace; font-size: 12px; }
  .gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .gallery img { width: 110px; cursor: pointer; border: 2px solid transparent; border-radius: 4px; }
  .gallery img:hover { border-color: #2b5797; }
  small { color: #666; }
</style>
</head>
<body>
<header><h1>Klassenlisten-Foto-Generator – Testbilder für OCR</h1></header>

<div class="wrap">
  <div class="panel">
    <h2>Einstellungen</h2>

    <div class="row">
      <div><label>Klasse</label><input type="text" id="klasse" value="7b"></div>
      <div><label>Schuljahr</label><input type="text" id="schuljahr" value="2026/27"></div>
    </div>
    <div class="row">
      <div><label>Anzahl Schüler</label><input type="number" id="anzahl" value="24" min="5" max="34"></div>
      <div><label>Seed (0 = zufällig)</label><input type="number" id="seed" value="0" min="0"></div>
    </div>

    <label>Schriftart / Stil</label>
    <select id="stil">
      <option value="druck">Gedruckt (Arial)</option>
      <option value="schreibmaschine">Schreibmaschine (Courier)</option>
      <option value="hand">Handschrift-ähnlich (Schreibschrift)</option>
      <option value="mix">Mix (zufällig)</option>
    </select>

    <label>Papier</label>
    <select id="papier">
      <option value="weiss">Weiß</option>
      <option value="liniert">Liniert</option>
      <option value="kariert">Kariert</option>
      <option value="mix">Mix (zufällig)</option>
    </select>

    <div class="chk">
      <label>Spalten:</label>
      <label><input type="checkbox" id="cNr" checked> Nr.</label>
      <label><input type="checkbox" id="cGeb" checked> Geburtsdatum</label>
      <label><input type="checkbox" id="cBem"> Bemerkung</label>
    </div>

    <label>Namensformat</label>
    <select id="format">
      <option value="nv">Nachname, Vorname</option>
      <option value="vn">Vorname Nachname</option>
    </select>

    <label>Drehung (max. °): <span id="vRot">3</span></label>
    <input type="range" id="rot" min="0" max="15" step="0.5" value="3">
    <label>Rauschen: <span id="vNoise">20</span></label>
    <input type="range" id="noise" min="0" max="80" value="20">
    <label>Unschärfe (px): <span id="vBlur">0.6</span></label>
    <input type="range" id="blur" min="0" max="4" step="0.1" value="0.6">
    <label>Schatten / Beleuchtung: <span id="vShadow">40</span></label>
    <input type="range" id="shadow" min="0" max="100" value="40">
    <label>Perspektive (Schräglage): <span id="vPersp">20</span></label>
    <input type="range" id="persp" min="0" max="100" value="20">

    <button id="btnGen">Neues Bild erzeugen</button>
    <button id="btnBatch" class="sec">Stapel (x Bilder)</button>
    <input type="number" id="batchN" value="5" min="1" max="50" style="width:70px;margin-left:6px">
    <br>
    <button id="btnPng" class="sec">PNG herunterladen</button>
    <button id="btnTxt" class="sec">Lösungstext (.txt)</button>
    <button id="btnJson" class="sec">Lösung (.json)</button>
    <br><small>Die Lösung enthält die „richtigen" Namen – zum automatischen Vergleich mit dem OCR-Ergebnis. Alle Namen sind frei erfunden.</small>
  </div>

  <div class="out">
    <canvas id="cv" width="1400" height="1900"></canvas>
    <div class="gallery" id="gallery"></div>
  </div>

  <div class="panel" style="width:360px">
    <h2>Erwarteter Text (Ground Truth)</h2>
    <textarea id="truth" readonly></textarea>
  </div>
</div>

<script>
(() => {
  const VN = ["Anna","Ben","Clara","David","Emilia","Felix","Greta","Hannes","Ida","Jonas","Katharina","Leon","Marie","Noah","Olivia","Paul","Qendresa","Rafael","Sophie","Tim","Ulla","Valentin","Wiebke","Xaver","Yasmin","Zoe","Mehmet","Ayşe","Luca","Mia","Lukas","Emma","Elias","Lina","Finn","Hanna","Jan","Lea","Max","Nele","Oskar","Pia","Samuel","Theresa","Amelie","Dominik","Fatima","Jannik","Kevin","Laura","Matteo","Nina","Özlem","Philipp","Rosa","Stefan","Tamara","Viktor","Zeynep","Jörg","Günther","Märit","Søren","Łukasz","Milena"];
  const NN = ["Müller","Schmidt","Schneider","Fischer","Weber","Meyer","Wagner","Becker","Schulz","Hoffmann","Schäfer","Koch","Bauer","Richter","Klein","Wolf","Schröder","Neumann","Schwarz","Zimmermann","Braun","Krüger","Hofmann","Hartmann","Lange","Schmitt","Werner","Schmitz","Krause","Meier","Lehmann","Schmid","Schulze","Maier","Köhler","Herrmann","König","Walter","Mayer","Huber","Kaiser","Fuchs","Peters","Lang","Scholz","Möller","Weiß","Jung","Hahn","Schubert","Vogel","Friedrich","Keller","Günther","Frank","Berger","Winkler","Roth","Beck","Lorenz","Baumann","Franke","Albrecht","Schuster","Simon","Ludwig","Böhm","Winter","Kraus","Martin","Schumacher","Krämer","Vogt","Stein","Jäger","Otto","Sommer","Groß","Seidel","Heinrich","Brandt","Haas","Schreiber","Graf","Schulte","Dietrich","Ziegler","Kuhn","Kühn","Pohl","Engel","Horn","Busch","Bergmann","Thomas","Voigt","Sauer","Arnold","Wolff","Pfeiffer","Yılmaz","Kowalski","Öztürk","Nowak","Çelik"];

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  let current = { truth: null, name: "klassenliste" };

  // Seeded PRNG
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  ["rot","noise","blur","shadow","persp"].forEach(id=>{
    const map={rot:"vRot",noise:"vNoise",blur:"vBlur",shadow:"vShadow",persp:"vPersp"};
    $(id).addEventListener("input",()=>$(map[id]).textContent=$(id).value);
  });

  function pick(r, arr){ return arr[Math.floor(r()*arr.length)]; }

  function makeStudents(r, n, fmt) {
    const used = new Set(), list = [];
    while (list.length < n) {
      const v = pick(r, VN), nn = pick(r, NN), key = v+nn;
      if (used.has(key)) continue;
      used.add(key);
      const y = 2012 + Math.floor(r()*3); // 7. Klasse ca. 2012-2014
      const m = 1 + Math.floor(r()*12), d = 1 + Math.floor(r()*28);
      list.push({ vn: v, nn: nn, geb: String(d).padStart(2,"0")+"."+String(m).padStart(2,"0")+"."+y });
    }
    list.sort((a,b)=>a.nn.localeCompare(b.nn,"de")||a.vn.localeCompare(b.vn,"de"));
    return list;
  }

  const FONTS = {
    druck: { family: "Arial, Helvetica, sans-serif", size: 34, jitter: 0, color: "#111" },
    schreibmaschine: { family: "'Courier New', Courier, monospace", size: 34, jitter: 0.6, color: "#222" },
    hand: { family: "'Segoe Script','Bradley Hand','Comic Sans MS','Brush Script MT',cursive", size: 34, jitter: 3, color: "#14257a" }
  };

  function render(opts) {
    const seed = opts.seed || Math.floor(Math.random()*1e9);
    const r = mulberry32(seed);
    const W = cv.width, H = cv.height;

    const stil = opts.stil === "mix" ? pick(r, ["druck","schreibmaschine","hand"]) : opts.stil;
    const papier = opts.papier === "mix" ? pick(r, ["weiss","liniert","kariert"]) : opts.papier;
    const F = FONTS[stil];
    const students = makeStudents(r, opts.anzahl, opts.format);

    // Hintergrund (Tisch)
    const tableCol = pick(r, ["#6b4a2f","#8a8a86","#3d3d42","#a07850","#c9c3b5"]);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha = 1; ctx.filter = "none";
    ctx.fillStyle = tableCol; ctx.fillRect(0,0,W,H);
    for (let i=0;i<60;i++){ ctx.fillStyle = `rgba(0,0,0,${r()*0.06})`; ctx.fillRect(0, r()*H, W, 2+r()*8); }

    // Papier-Position
    const PW = 1080, PH = 1560;
    const rot = (r()*2-1) * opts.rot * Math.PI/180;
    ctx.save();
    ctx.translate(W/2 + (r()*2-1)*20, H/2 + (r()*2-1)*20);
    ctx.rotate(rot);
    // leichte Perspektive via Scherung
    const sk = (r()*2-1) * opts.persp/100 * 0.08;
    ctx.transform(1, sk*0.4, sk, 1, 0, 0);

    ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 30; ctx.shadowOffsetX = 8; ctx.shadowOffsetY = 12;
    ctx.fillStyle = pick(r, ["#fdfdfb","#faf8f0","#f4f4f0"]);
    ctx.fillRect(-PW/2, -PH/2, PW, PH);
    ctx.shadowColor = "transparent";

    // Papiermuster
    ctx.save();
    ctx.beginPath(); ctx.rect(-PW/2,-PH/2,PW,PH); ctx.clip();
    ctx.translate(-PW/2, -PH/2);
    if (papier === "liniert") {
      ctx.strokeStyle = "rgba(70,110,190,0.45)"; ctx.lineWidth = 2;
      for (let y=140; y<PH; y+=46){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(PW,y); ctx.stroke(); }
      ctx.strokeStyle = "rgba(210,60,60,0.6)"; ctx.beginPath(); ctx.moveTo(90,0); ctx.lineTo(90,PH); ctx.stroke();
    } else if (papier === "kariert") {
      ctx.strokeStyle = "rgba(70,110,190,0.35)"; ctx.lineWidth = 1.5;
      for (let y=0; y<PH; y+=30){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(PW,y); ctx.stroke(); }
      for (let x=0; x<PW; x+=30){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,PH); ctx.stroke(); }
    }
    // Lochung
    ctx.fillStyle = tableCol;
    [PH*0.28, PH*0.72].forEach(y=>{ ctx.beginPath(); ctx.arc(34,y,13,0,7); ctx.fill(); });

    // ---- Inhalt ----
    const truthLines = [];
    const wob = () => (r()*2-1) * F.jitter;
    const text = (t, x, y, size, bold, align) => {
      ctx.save();
      ctx.fillStyle = F.color;
      ctx.font = `${bold?"bold ":""}${size}px ${F.family}`;
      ctx.textAlign = align || "left"; ctx.textBaseline = "alphabetic";
      ctx.translate(x + wob(), y + wob());
      ctx.rotate(wob() * 0.004);
      ctx.fillText(t, 0, 0);
      ctx.restore();
    };

    const title = `Klassenliste ${opts.klasse}`;
    text(title, 130, 110, 54, true);
    truthLines.push(title);
    const sub = `Schuljahr ${opts.schuljahr}`;
    text(sub, 130, 160, 32);
    truthLines.push(sub);
    const lehrer = `Klassenlehrer/in: ${pick(r, ["Frau","Herr"])} ${pick(r, NN)}`;
    text(lehrer, 130, 205, 28);
    truthLines.push(lehrer);
    truthLines.push("");

    // Spalten
    const cols = [];
    let x = 120;
    if (opts.cNr)  { cols.push({k:"nr",  h:"Nr.",  x:x, w:70}); x += 70; }
    cols.push({k:"name", h: opts.format==="nv" ? "Name, Vorname" : "Name", x:x, w: 440}); x += 440;
    if (opts.cGeb) { cols.push({k:"geb", h:"Geburtsdatum", x:x, w:250}); x += 250; }
    if (opts.cBem) { cols.push({k:"bem", h:"Bemerkung", x:x, w:PW-x-50}); x = PW-50; }
    const tableRight = Math.min(PW-40, x + 10);

    const top = 270;
    const rowH = Math.min(52, Math.floor((PH - top - 120) / (students.length + 1)));
    const fs = Math.max(22, Math.min(F.size, rowH - 12));

    // Kopfzeile
    ctx.strokeStyle = "#222"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(100, top); ctx.lineTo(tableRight, top); ctx.stroke();
    cols.forEach(c => text(c.h, c.x + 6, top + rowH - 14, fs - 4, true));
    truthLines.push(cols.map(c=>c.h).join(" | "));
    ctx.beginPath(); ctx.moveTo(100, top+rowH); ctx.lineTo(tableRight, top+rowH); ctx.stroke();

    ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(0,0,0,.55)";
    students.forEach((s, i) => {
      const y = top + rowH * (i+2);
      const name = opts.format === "nv" ? `${s.nn}, ${s.vn}` : `${s.vn} ${s.nn}`;
      s.name = name;
      const parts = [];
      cols.forEach(c => {
        let t = "";
        if (c.k === "nr") t = (i+1) + ".";
        else if (c.k === "name") t = name;
        else if (c.k === "geb") t = s.geb;
        else if (c.k === "bem") t = r() < 0.12 ? pick(r, ["krank","Attest","Nachteilsausgleich","fehlt","Wechsel","Tutor"]) : "";
        if (t) text(t, c.x + 6, y - 14, fs, false);
        parts.push(t);
      });
      truthLines.push(parts.join(" | "));
      ctx.beginPath(); ctx.moveTo(100, y); ctx.lineTo(tableRight, y); ctx.stroke();
    });
    // senkrechte Linien
    ctx.lineWidth = 1.5;
    cols.forEach(c => { ctx.beginPath(); ctx.moveTo(c.x, top); ctx.lineTo(c.x, top + rowH*(students.length+1)); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(tableRight, top); ctx.lineTo(tableRight, top + rowH*(students.length+1)); ctx.stroke();

    // Kaffeefleck
    if (r() < 0.3) {
      const cx = 200 + r()*(PW-400), cy = 300 + r()*(PH-600);
      ctx.strokeStyle = "rgba(110,70,30,0.35)"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(cx, cy, 55+r()*20, 0, 6.1); ctx.stroke();
    }
    ctx.restore(); // Clip
    ctx.restore(); // Transform

    // ---- Nachbearbeitung ----
    // Beleuchtungsverlauf
    const sh = opts.shadow / 100;
    if (sh > 0) {
      const ang = r() * Math.PI * 2;
      const g = ctx.createLinearGradient(W/2 + Math.cos(ang)*W/2, H/2 + Math.sin(ang)*H/2,
                                         W/2 - Math.cos(ang)*W/2, H/2 - Math.sin(ang)*H/2);
      g.addColorStop(0, `rgba(255,255,255,${0.15*sh})`);
      g.addColorStop(1, `rgba(0,0,0,${0.55*sh})`);
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      // Vignette
      const v = ctx.createRadialGradient(W/2,H/2,H*0.3, W/2,H/2,H*0.75);
      v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,`rgba(0,0,0,${0.5*sh})`);
      ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
    }
    // Unschärfe
    if (opts.blur > 0) {
      const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H;
      tmp.getContext("2d").drawImage(cv, 0, 0);
      ctx.save(); ctx.filter = `blur(${opts.blur}px)`; ctx.drawImage(tmp, 0, 0); ctx.restore();
      ctx.filter = "none";
    }
    // Rauschen
    if (opts.noise > 0) {
      const img = ctx.getImageData(0,0,W,H), d = img.data, a = opts.noise;
      for (let i=0;i<d.length;i+=4){
        const n = (Math.random()*2-1) * a;
        d[i]+=n; d[i+1]+=n; d[i+2]+=n;
      }
      ctx.putImageData(img,0,0);
    }

    const header = [`Klasse: ${opts.klasse}`, `Schuljahr: ${opts.schuljahr}`, `Stil: ${stil}, Papier: ${papier}, Seed: ${seed}`, "----------------------------------------"];
    current = {
      seed, stil, papier,
      truth: truthLines.join("\n"),
      json: { klasse: opts.klasse, schuljahr: opts.schuljahr, seed, stil, papier, schueler: students.map((s,i)=>({nr:i+1, nachname:s.nn, vorname:s.vn, name:s.name, geburtsdatum:s.geb})) },
      name: `klassenliste_${opts.klasse}_${seed}`
    };
    $("truth").value = header.join("\n") + "\n" + current.truth;
    return current;
  }

  function getOpts(seedOverride) {
    return {
      klasse: $("klasse").value || "7b",
      schuljahr: $("schuljahr").value || "2026/27",
      anzahl: Math.max(5, Math.min(34, +$("anzahl").value || 24)),
      seed: seedOverride !== undefined ? seedOverride : (+$("seed").value || 0),
      stil: $("stil").value, papier: $("papier").value, format: $("format").value,
      cNr: $("cNr").checked, cGeb: $("cGeb").checked, cBem: $("cBem").checked,
      rot: +$("rot").value, noise: +$("noise").value, blur: +$("blur").value,
      shadow: +$("shadow").value, persp: +$("persp").value
    };
  }

  function download(blobOrUrl, filename) {
    const a = document.createElement("a");
    a.href = typeof blobOrUrl === "string" ? blobOrUrl : URL.createObjectURL(blobOrUrl);
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  }

  function addThumb() {
    const img = new Image();
    img.src = cv.toDataURL("image/jpeg", 0.6);
    img.title = current.name;
    const snap = { ...current };
    const full = cv.toDataURL("image/png");
    img.onclick = () => { download(full, snap.name + ".png"); };
    $("gallery").prepend(img);
  }

  $("btnGen").onclick = () => { render(getOpts()); addThumb(); };
  $("btnPng").onclick = () => cv.toBlob(b => download(b, current.name + ".png"));
  $("btnTxt").onclick = () => download(new Blob([current.truth], {type:"text/plain;charset=utf-8"}), current.name + ".txt");
  $("btnJson").onclick = () => download(new Blob([JSON.stringify(current.json,null,2)], {type:"application/json"}), current.name + ".json");

  $("btnBatch").onclick = async () => {
    const n = Math.max(1, Math.min(50, +$("batchN").value || 5));
    for (let i = 0; i < n; i++) {
      render(getOpts(0));
      addThumb();
      await new Promise(res => cv.toBlob(b => { download(b, current.name + ".png"); res(); }));
      await new Promise(res => setTimeout(res, 250));
      download(new Blob([current.truth], {type:"text/plain;charset=utf-8"}), current.name + ".txt");
      await new Promise(res => setTimeout(res, 250));
    }
  };

  render(getOpts()); addThumb();
})();
</script>
</body>
</html>
