<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latein-Vokabeltrainer</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1e1d1a; --muted:#6c685f; --line:#e2ded3;
    --accent:#8c2f39; --accent-ink:#fff; --ok:#2f7d4f; --ok-bg:#e4f3ea; --bad:#b3261e; --bad-bg:#fbe6e4; --warn:#8a5a00; --warn-bg:#fdf0c9;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#17161a; --card:#222126; --ink:#f0eee8; --muted:#a09c93; --line:#37353c;
      --accent:#d56b76; --accent-ink:#1a1214; --ok:#6fcf97; --ok-bg:#1d3326; --bad:#ff8a80; --bad-bg:#3b1f1e; --warn:#f2c14e; --warn-bg:#3a2f10;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:1.7rem;margin:0;letter-spacing:.01em}
  h1 span{color:var(--accent)}
  h2{font-size:1.05rem;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .muted{color:var(--muted);font-size:.9rem}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;cursor:pointer;transition:transform .08s,background .15s,filter .15s}
  button:hover{background:color-mix(in srgb,var(--card) 88%,var(--accent))}
  button:active{transform:scale(.95)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.primary:hover{filter:brightness(1.1);background:var(--accent)}
  button.danger{color:var(--bad)}
  button.icon{padding:6px 11px;font-size:1.1rem;line-height:1}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .headright{display:flex;align-items:center;gap:12px}
  .status{margin-top:8px;font-size:.92rem;min-height:1.3em}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 6px}
  td{padding:3px 4px}
  td input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  td input:focus,.answer:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
  td.n{width:34px;color:var(--muted);text-align:right;font-size:.85rem}
  td.x{width:42px}
  td.x button{padding:6px 10px;line-height:1}
  .tablewrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
  textarea,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  textarea{min-height:110px;resize:vertical}
  label.opt{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);flex:1;min-width:170px}
  label.check{display:flex;align-items:center;gap:8px;font-size:.92rem;margin-top:12px;cursor:pointer}
  label.check input{width:18px;height:18px;accent-color:var(--accent)}
  details summary{cursor:pointer;font-weight:600}
  details[open] summary{margin-bottom:10px}

  /* ---------- Quiz ---------- */
  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .pill{font-size:.85rem;color:var(--muted)}
  .streak{font-weight:700;color:var(--accent);min-width:60px;text-align:right}
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 14px}
  .progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#e7b04a));transition:width .45s cubic-bezier(.3,.9,.3,1)}
  .qcard{text-align:center;padding:34px 20px 28px}
  .dir{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .prompt{font-family:Georgia,serif;font-size:clamp(1.7rem,6vw,2.6rem);margin:6px 0 22px;word-break:break-word}
  .answer{width:100%;max-width:480px;font:inherit;font-size:1.15rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center;transition:border-color .2s}
  .answer:focus{border-color:var(--accent);outline:none}
  .hint{margin-top:12px;font-size:.92rem;color:var(--muted);min-height:2.6em}
  .dots{display:flex;gap:7px;justify-content:center;margin-bottom:5px}
  .dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);transition:all .25s}
  .dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
  .dots i.over{background:var(--bad);border-color:var(--bad)}
  .feedback{margin:18px auto 0;max-width:560px;padding:14px 16px;border-radius:12px;text-align:left;display:none}
  .feedback.ok{display:block;background:var(--ok-bg);color:var(--ok);animation:fbIn .35s ease both}
  .feedback.bad{display:block;background:var(--bad-bg);color:var(--bad);animation:fbIn .35s ease both}
  .feedback.neutral{display:block;background:var(--bg);color:var(--ink);animation:fbIn .35s ease both}
  .feedback.warn{display:block;background:var(--warn-bg);color:var(--warn);animation:fbIn .35s ease both}
  .feedback.warn .fbtitle{color:var(--warn)}
  .feedback b{color:var(--ink)}
  .fbtitle{font-weight:700;font-size:1.05rem;margin-bottom:6px}
  .fbline{font-size:.92rem;margin-top:6px;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
  .chip{padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
  .chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
  .chip.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);text-decoration:line-through}
  .chip.dup{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
  .chip.miss{border:1px dashed var(--warn);color:var(--warn);background:var(--warn-bg)}
  .warnrow{border-left:4px solid var(--warn);padding-left:10px}
  .reveal{font-size:1.4rem;margin:8px 0 6px;font-family:Georgia,serif}
  .actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .score{font-size:3.2rem;font-family:Georgia,serif;margin:6px 0}
  .badlist{text-align:left;max-width:560px;margin:16px auto 0}
  .badlist div{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
  .hidden{display:none!important}
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

  /* ---------- Animationen ---------- */
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes fbIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
  @keyframes glowOk{0%{box-shadow:0 0 0 0 rgba(47,125,79,.6)}100%{box-shadow:0 0 0 30px rgba(47,125,79,0)}}
  @keyframes glowBad{0%{box-shadow:0 0 0 0 rgba(179,38,30,.5)}100%{box-shadow:0 0 0 30px rgba(179,38,30,0)}}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
  @keyframes bounce{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}10
